plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
    id "com.modrinth.minotaur" version "2.+"
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

def changelogText = rootProject.file("CHANGELOG.md").text

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.terraformersmc.com" }
}

dependencies {
    include(modImplementation("net.satisfy.foundation:foundation-fabric:${rootProject.foundation_version}") { transitive = false })
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"


    modApi include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_fabric_version}")
    modApi "com.terraformersmc:biolith-fabric:${rootProject.biolith_version}"

    modCompileOnlyApi("maven.modrinth:sodium:mc1.20.1-0.5.11")
    modCompileOnlyApi("maven.modrinth:iris:1.7.5+1.20.1")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "sleepy-hollows"
    versionNumber = rootProject.mod_version
    versionName = "${rootProject.archives_base_name}-${rootProject.mod_version} [${rootProject.minecraft_version}-fabric]"
    versionType = "release"
    changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : " "
    gameVersions = [rootProject.minecraft_version]
    loaders = ["fabric"]
    uploadFile = remapJar
    additionalFiles = [sourcesJar]

    dependencies {
        required.project "architectury-api"
        required.project "cloth-config"
        required.project "biolith"
    }
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")
    project {
        id = "1124163"
        releaseType = "release"
        addGameVersion rootProject.minecraft_version
        addGameVersion "Fabric"
        mainArtifact(remapJar) {
            displayName = "SleepyHollows - ${rootProject.mod_version} - FABRIC - ${rootProject.minecraft_version}"
            changelog = changelogText
            changelogType = "markdown"
        }
        addArtifact(sourcesJar)

        relations {
            requiredDependency "architectury-api"
            requiredDependency "cloth-config"
            requiredDependency "biolith"

        }
    }
}

tasks.register("releaseChangelog") {
    group = "publishing"
    description = "Send the latest changelog block to Discord"

    doLast {
        def discordWebhookUrl = (project.findProperty("webhook") ?: System.getenv("DISCORD_WEBHOOK_URL"))?.toString()?.trim()
        if (!discordWebhookUrl) {
            println "No Discord webhook set. Provide -Pwebhook=... or set DISCORD_WEBHOOK_URL"
            return
        }
        println "Using Discord webhook: ${discordWebhookUrl.replaceAll('/api/webhooks/[^/]+/[^/]+$', '/api/webhooks/********/********')}"

        def modName = (project.findProperty("modDisplayName") ?: "sleepy hollows").toString()
        def versionLabel = rootProject.mod_version
        def full = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : ""
        def m = (full =~ /(?ms)^(\[[^\]\n]+\][ \t]*$.*?)(?:^\*\*\*[ \t]*$|\z)/)
        def block = m.find() ? m.group(1).trim() : full.trim()

        int embedLimit = 4000
        int messageLimit = 5500
        def chunks = []
        def current = new StringBuilder()
        block.readLines().each { line ->
            if (current.length() + line.length() + 1 > embedLimit) {
                chunks << current.toString().trim()
                current = new StringBuilder()
            }
            current.append(line).append("\n")
        }
        if (current.toString().trim()) chunks << current.toString().trim()

        def links = "[Modrinth](https://modrinth.com/mod/sleepy-hollows)\n[CurseForge](https://www.curseforge.com/minecraft/mc-mods/sleepy-hollows)"
        def messages = [[]]
        int messageSize = 0
        chunks.eachWithIndex { chunk, index ->
            if (messages.last().size() == 10 || messageSize + chunk.length() > messageLimit) {
                messages << []
                messageSize = 0
            }
            def embed = [description: chunk]
            if (index == 0) embed.title = "**Changelog**"
            if (index == chunks.size() - 1) embed.fields = [[name: "**Download it on**", value: links, inline: false]]
            messages.last() << embed
            messageSize += chunk.length()
        }

        boolean dryRun = (project.findProperty("dryRun") ?: "false").toString().toBoolean()
        messages.eachWithIndex { embeds, index ->
            def payload = [
                    username  : "[Let’s Do] Assistant",
                    avatar_url: "https://raw.githubusercontent.com/Cursee-Development/Sleepy-Hollows/main/common/src/main/resources/pack.png",
                    embeds    : embeds
            ]
            if (index == 0) payload.content = "**${modName} ${versionLabel} has been released! 🎉**\n\nLearn about all changes and improvements below:".toString()
            def json = groovy.json.JsonOutput.toJson(payload)
            if (dryRun) {
                println "DRY RUN — message ${index + 1}/${messages.size()}:\n${groovy.json.JsonOutput.prettyPrint(json)}"
                return
            }
            HttpURLConnection conn = (HttpURLConnection) new URL(discordWebhookUrl).openConnection()
            try {
                conn.setRequestMethod("POST")
                conn.setDoOutput(true)
                byte[] body = json.getBytes("UTF-8")
                conn.setRequestProperty("Content-Type", "application/json")
                conn.setRequestProperty("Content-Length", Integer.toString(body.length))
                conn.getOutputStream().write(body)
                int code = conn.getResponseCode()
                println "Discord message ${index + 1}/${messages.size()}: ${code} ${conn.getResponseMessage()}"
                if (code >= 300) {
                    def error = conn.getErrorStream()
                    if (error != null) println error.getText("UTF-8")
                }
            } finally {
                conn.disconnect()
            }
            if (index < messages.size() - 1) Thread.sleep(1000)
        }
    }
}

tasks.named("modrinth").configure {
    finalizedBy(tasks.named("releaseChangelog"))
}


